    <!-- ============================================================
         Portal header — two-tier "Layered Clinical" design
         Tier 1: utility strip (portal context + live clock)
         Tier 2: working bar (brand · search · actions · user)
         Palette & type locked to Al Hammadi brand standards.
         ============================================================ -->
    <header class="app-header sticky-top">

        <!-- Tier 1 · utility strip -->
        <div class="app-header__utility">
            <div class="app-header__context">
                <b>{{ portalTitle }}</b>
                <!-- <span class="app-header__sep"></span> -->
                <!-- <span>{{ facilityName }}</span>
                <span class="app-header__sep"></span>
                <span>{{ sessionStatus }}</span> -->
            </div>
            <div class="app-header__meta">
                <span>{{ currentDate }}</span>
                <span>{{ currentTime }}</span>
            </div>
        </div>

        <!-- Tier 2 · working bar -->
        <div class="app-header__main">

            <!-- Brand -->
            <div class="app-header__brand">
                <img src="assets/images/AHH-Logo.png" alt="" style="height: 40px;">
                <!-- <div class="app-header__mark">AH</div>
                <div class="app-header__brand-text">
                    <div class="app-header__ar">مستشفيات الحمادي</div>
                    <div class="app-header__en">Al Hammadi Hospitals</div>
                </div> -->
            </div>

            <!-- Search -->
            <div class="app-header__search d-none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input #searchBox type="text" placeholder="Search patients, forms, modules…"
                       (keyup.enter)="onSearch(searchBox.value)">
            </div>

            <!-- Actions + user -->
            <div class="app-header__actions">
                <div class="app-header__notifwrap">
                    <button class="app-header__iconbtn" type="button" title="Notifications"
                            [class.is-blinking]="hasNewNotifications"
                            (click)="toggleNotifications($event)">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="app-header__badge" [class.is-new]="hasNewNotifications" *ngIf="notifCount > 0">{{ notifCount > 9 ? '9+' : notifCount }}</span>
                    </button>

                    <!-- backdrop: dims the page and gives the panel somewhere to close on click -->
                    <div class="app-header__notif-backdrop" *ngIf="notifOpen" (click)="closeNotifications($event)"></div>

                    <div class="app-header__notif" *ngIf="notifOpen" (click)="$event.stopPropagation()">
                        <div class="app-header__notif-head">
                            <div class="app-header__notif-head-left">
                                <span class="app-header__notif-headic">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                </span>
                                <div class="d-flex flex-column">
                                    <span class="app-header__notif-title">Pending your signature</span>
                                    <span class="app-header__notif-count">{{ notifCount }} document{{ notifCount === 1 ? '' : 's' }} awaiting action</span>
                                </div>
                            </div>

                            <button type="button" class="app-header__notif-clear" title="Close" aria-label="Close"
                                    (click)="closeNotifications($event)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                            </button>
                        </div>
                        <div class="app-header__notif-list">
                            <button type="button" class="app-header__notif-item" [class.is-new]="isNew(n)" [class.is-today]="isToday(n)"
                                    *ngFor="let n of sortedPendingNotifications" (click)="openNotification(n)">
                                <span class="app-header__notif-ic">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1 4-3 5-6s2-5 3-5 1 2 0 5-2 6 0 6 3-2 4-3"/><path d="M3 21h18"/></svg>
                                </span>
                                <span class="app-header__notif-txt">
                                    <span class="app-header__notif-name">
                                        {{ n.Name }}
                                        <span class="app-header__notif-todaytag" *ngIf="isToday(n)">Today</span>
                                        <span class="app-header__notif-newtag" *ngIf="isNew(n)">New</span>
                                    </span>
                                    <span class="app-header__notif-sub">Awaiting your signature</span>
                                    <span class="app-header__notif-meta">
                                        <span class="app-header__notif-meta-user" *ngIf="n.CreatedBy">{{ n.CreatedBy }}</span>
                                        <span class="app-header__notif-meta-sep" *ngIf="n.CreatedBy && n.CreatedOn">·</span>
                                        <span class="app-header__notif-meta-date" *ngIf="n.CreatedOn">{{ n.CreatedOn | date:'MMM d, y, h:mm a' }}</span>
                                        <span class="app-header__notif-meta-days" [class.is-today]="isToday(n)" *ngIf="n.CreatedOn">{{ pendingDaysLabel(n.CreatedOn) }}</span>
                                    </span>
                                </span>
                                <span class="app-header__notif-action">
                                    Sign now
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                                </span>
                            </button>
                            <div class="app-header__notif-empty" *ngIf="!pendingNotifications.length">
                                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                                <div class="app-header__notif-empty-title">You're all caught up</div>
                                <div class="app-header__notif-empty-sub">No documents are waiting on your signature.</div>
                            </div>
                        </div>
                        <button type="button" class="app-header__notif-all" *ngIf="pendingNotifications.length" (click)="viewAllPending()">
                            View all pending documents
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                        </button>
                    </div>
                </div>

                <button class="app-header__iconbtn" type="button" title="Log out" (click)="logout()">
                    <!-- <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg> -->

                    <path d="M12.6336 11.4385V13.4873C12.6336 14.8873 11.4728 16.0482 10.0728 16.0482H2.5609C1.1609 16.0482 0 14.8873 0 13.4873V2.5609C0 1.1609 1.1609 0 2.5609 0H10.0728C11.4728 0 12.6336 1.1609 12.6336 2.5609V4.6097C12.6336 5.0877 12.258 5.4633 11.78 5.4633C11.302 5.4633 10.9264 5.0877 10.9264 4.6097V2.5609C10.9264 2.0829 10.5508 1.7073 10.0728 1.7073H2.5609C2.0829 1.7073 1.7072 2.0829 1.7072 2.5609V13.4873C1.7072 13.9653 2.0829 14.3409 2.5609 14.3409H10.0728C10.5508 14.3409 10.9264 13.9653 10.9264 13.4873V11.4385C10.9264 10.9604 11.302 10.5848 11.78 10.5848C12.258 10.5848 12.6336 10.9604 12.6336 11.4385ZM19.8382 8.5022C19.8382 8.4682 19.8723 8.4682 19.8723 8.4339C19.8723 8.3998 19.9063 8.3655 19.9063 8.3655C19.9063 8.3315 19.9404 8.2972 19.9404 8.2972C19.9404 8.2631 19.9404 8.2631 19.9745 8.2288C20.0085 8.1264 20.0085 7.9897 19.9745 7.8873C19.9745 7.8532 19.9745 7.8532 19.9404 7.8189C19.9404 7.7848 19.9404 7.7505 19.9063 7.7505C19.9063 7.7165 19.8723 7.6822 19.8723 7.6822C19.8723 7.6481 19.8382 7.6481 19.8382 7.6138C19.8042 7.5798 19.7699 7.5114 19.7358 7.4774L15.9114 3.6194C15.5698 3.2779 15.0237 3.2779 14.7162 3.6194C14.3746 3.9609 14.3746 4.5071 14.7162 4.8146L17.0723 7.1707L6.3166 7.1704C5.8386 7.1704 5.463 7.546 5.463 8.024C5.463 8.5021 5.8386 8.8777 6.3166 8.8777H17.0381L14.682 11.2337C14.3405 11.5753 14.3405 12.1214 14.682 12.4289C14.8528 12.5997 15.0577 12.6681 15.2965 12.6681C15.5357 12.6681 15.7405 12.5997 15.911 12.4289L19.7352 8.6048C19.7697 8.6048 19.8039 8.5363 19.8382 8.5022Z" fill="currentColor"/>
                    </svg>

                </button>

                <div class="app-header__user" [class.open]="userMenuOpen" (click)="toggleUserMenu($event)">
                    <div class="app-header__avatar">
                        <img *ngIf="photoUrl" [src]="photoUrl" alt="" (error)="photoUrl = null">
                        <span *ngIf="!photoUrl">{{ avatarInitials }}</span>
                    </div>
                    <div class="app-header__user-info">
                        <div class="app-header__user-name">{{ loginUserName }}</div>
                        <div class="app-header__user-role">
                            {{ empDesignation }}<span *ngIf="empId"> · #{{ empId }}</span>
                        </div>
                    </div>
                    <svg class="app-header__chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>

                    <!-- user dropdown -->
                    <div class="app-header__menu" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
                        <button type="button" class="app-header__menuitem" (click)="goToProfile()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                            Profile
                        </button>
                        <span class="app-header__menusep"></span>
                        <button type="button" class="app-header__menuitem" (click)="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <div class="d-flex gap-0">
        <!-- <div class="left-nav col-lg-2 col-md-4" id="leftnav" >
            <div class="offcanvas offcanvas-start h-100"> -->
        <app-sidebar></app-sidebar>
        <!-- </div>
       </div> -->
        <div class="main-container container-fluid p-0">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
