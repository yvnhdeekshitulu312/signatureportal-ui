    <!-- ============================================================
         Portal header — two-tier "Layered Clinical" design
         Tier 1: utility strip (portal context + live clock)
         Tier 2: working bar (brand · search · actions · user)
         Palette & type locked to Al Hammadi brand standards.
         ============================================================ -->
    <header class="app-header sticky-top">

        <!-- Tier 1 · utility strip -->
        <div class="app-header__utility">
            <div class="app-header__context">
                <b>{{ portalTitle }}</b>
                <!-- <span class="app-header__sep"></span> -->
                <!-- <span>{{ facilityName }}</span>
                <span class="app-header__sep"></span>
                <span>{{ sessionStatus }}</span> -->
            </div>
            <div class="app-header__meta">
                <span>{{ currentDate }}</span>
                <span>{{ currentTime }}</span>
            </div>
        </div>

        <!-- Tier 2 · working bar -->
        <div class="app-header__main">

            <!-- Brand -->
            <div class="app-header__brand">
                <img src="assets/images/AHH-Logo.png" alt="" style="height: 40px;">
                <!-- <div class="app-header__mark">AH</div>
                <div class="app-header__brand-text">
                    <div class="app-header__ar">مستشفيات الحمادي</div>
                    <div class="app-header__en">Al Hammadi Hospitals</div>
                </div> -->
            </div>

            <!-- Search -->
            <div class="app-header__search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input #searchBox type="text" placeholder="Search patients, forms, modules…"
                       (keyup.enter)="onSearch(searchBox.value)">
            </div>

            <!-- Actions + user -->
            <div class="app-header__actions">
                <div class="app-header__notifwrap">
                    <button class="app-header__iconbtn" type="button" title="Notifications" (click)="toggleNotifications($event)">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="app-header__badge" *ngIf="notifCount > 0">{{ notifCount > 9 ? '9+' : notifCount }}</span>
                    </button>

                    <div class="app-header__notif" *ngIf="notifOpen" (click)="$event.stopPropagation()">
                        <div class="app-header__notif-head">
                            <div>
                                <div class="d-flex align-items-center gap-2">
                                    <button type="button" class="dv-iconbtn" title="">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4FCED2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                                    </button>
                                   <div class="d-flex flex-column">
                                        <span>Pending your signature</span>
                                        <span class="app-header__notif-count">{{ notifCount }} documents awaiting action</span>
                                   </div>
                                </div>
                            </div>

                            <button type="button" class="app-header__notif-clear ms-auto">
                                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">

                                </svg>


                            </button>
                        </div>
                        <div class="app-header__notif-list p-2">
                            <button type="button" class="app-header__notif-item" *ngFor="let n of pendingNotifications" (click)="openNotification(n)">
                                <span class="app-header__notif-ic">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1 4-3 5-6s2-5 3-5 1 2 0 5-2 6 0 6 3-2 4-3"/><path d="M3 21h18"/></svg>
                                </span>
                                <span class="app-header__notif-txt">
                                    <span class="app-header__notif-name">{{ n.Name }}</span>
                                    <span class="app-header__notif-sub">Awaiting your signature</span>
                                </span>
                                <button class="app-header__notif-action">
                                    Sign now
                                </button>
                            </button>
                            <div class="app-header__notif-empty" *ngIf="!pendingNotifications.length">You're all caught up.</div>
                        </div>
                        <button type="button" class="app-header__notif-all" *ngIf="pendingNotifications.length" (click)="viewAllPending()">View all &rarr;</button>
                    </div>
                </div>

                <button class="app-header__iconbtn" type="button" title="Log out" (click)="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>

                <div class="app-header__user" [class.open]="userMenuOpen" (click)="toggleUserMenu($event)">
                    <div class="app-header__avatar">
                        <img *ngIf="photoUrl" [src]="photoUrl" alt="" (error)="photoUrl = null">
                        <span *ngIf="!photoUrl">{{ avatarInitials }}</span>
                    </div>
                    <div class="app-header__user-info">
                        <div class="app-header__user-name">{{ loginUserName }}</div>
                        <div class="app-header__user-role">
                            {{ empDesignation }}<span *ngIf="empId"> · #{{ empId }}</span>
                        </div>
                    </div>
                    <svg class="app-header__chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>

                    <!-- user dropdown -->
                    <div class="app-header__menu" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
                        <button type="button" class="app-header__menuitem" (click)="goToProfile()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                            Profile
                        </button>
                        <span class="app-header__menusep"></span>
                        <button type="button" class="app-header__menuitem" (click)="logout()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Log out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <div class="d-flex gap-0">
        <!-- <div class="left-nav col-lg-2 col-md-4" id="leftnav" >
            <div class="offcanvas offcanvas-start h-100"> -->
        <app-sidebar></app-sidebar>
        <!-- </div>
       </div> -->
        <div class="main-container container-fluid p-0">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
