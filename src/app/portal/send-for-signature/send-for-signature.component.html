<!-- Send for Signatures — redesigned. All ReactiveForm bindings & handlers unchanged. -->
<div class="sfs">

  <!-- Sticky header -->
  <header class="sfs-header">
    <div class="sfs-header-inner">
      <div class="sfs-head-titles">
        <span class="eyebrow">e-Signature</span>
        <h1 class="sfs-title">Send for Signatures</h1>
      </div>
      <div class="sfs-actions">
        <button class="btn btn-main-outline" routerLink="/dashboard">Cancel</button>
        <button class="btn btn-main-fill" [disabled]="isUploading" (click)="gotoDocument()">
          Continue
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <form [formGroup]="form" class="sfs-body">

    <!-- Upload -->
    <section class="card upload-card">
      <div class="card-eyebrow">Document</div>

      <ng-container *ngIf="!pageImages.length">
        <!-- #fileInput stays OUTSIDE .dropzone (siblings) so a programmatic click()
             can't bubble back and fire a second upload. -->
        <input #fileInput type="file" name="myFile" id="upload-doc" accept="application/pdf"
               class="dz-input" hidden (change)="uploadFile($event)">

        <div class="dropzone" (click)="fileInput.click()"
             (dragover)="$event.preventDefault()" (drop)="onFileDropped($event)">
          <span class="dz-icon">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 16V4m0 0l-4 4m4-4l4 4" stroke="#1855A4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="#1855A4" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="dz-title">Drag your PDF here</div>
          <div class="dz-sub">PDF only · rendered securely on the server</div>
        </div>

        <div class="dz-alt">
          <button type="button" class="upload-btn" (click)="fileInput.click()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 15V3m0 0l-4 4m4-4l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Upload from computer
          </button>
        </div>
      </ng-container>

      <!-- rendered pages -->
      <div class="pages-preview" *ngIf="pageImages.length">
        <div class="pp-head">
          <span class="pp-ok">✓</span>
          <span>Uploaded · {{ pageImages.length }} page{{ pageImages.length > 1 ? 's' : '' }} rendered</span>
        </div>
        <div class="pp-grid">
          <div class="pp-thumb" *ngFor="let page of pageImages; let i = index">
            <img [src]="page" [alt]="'Page ' + (i + 1)">
            <small>Page {{ i + 1 }}</small>
          </div>
        </div>
      </div>

      <div class="uploading" *ngIf="isUploading">
        <span class="spinner" aria-hidden="true"></span> Uploading…
      </div>
    </section>

    <!-- Document name -->
    <section class="card">
      <label class="field-label" for="docName">Document Name</label>
      <input id="docName" type="text" class="input" formControlName="documentName"
             placeholder="e.g. HR Policy Acknowledgement">
    </section>

    <!-- Recipients -->
    <section class="card">
      <div class="section-head">
        <h6 class="section-title">Add Recipients</h6>
        <label class="order-toggle">
          <input type="checkbox" formControlName="sendInOrder">
          <span class="ot-track"><span class="ot-thumb"></span></span>
          Send in order
        </label>
      </div>

      <div class="recip-list" formArrayName="recipients">
        <div class="recip-row" *ngFor="let recipient of recipients.controls; let i = index" [formGroupName]="i">
          <span class="recip-order">{{ i + 1 }}</span>
          <div class="recip-fields">
            <input type="email" class="input" formControlName="email" placeholder="Email">
            <input type="text" class="input" formControlName="name" placeholder="Full name">
            <select class="input select" formControlName="role">
              <option value="Sign">Needs to sign</option>
              <option value="Approve">Needs to approve</option>
              <option value="View">Receives a copy</option>
            </select>
            <select class="input select" formControlName="deliveryMethod">
              <option value="Email">Email</option>
              <option value="Teams">Teams</option>
            </select>
          </div>
          <div class="recip-tools">
            <button type="button" class="btn btn-main-outline btn-xs">Customize</button>
            <button type="button" class="recip-remove" *ngIf="recipients.length > 1"
                    (click)="removeRecipient(i)" title="Remove recipient" aria-label="Remove recipient">&times;</button>
          </div>
        </div>
      </div>

      <button type="button" class="add-recip" (click)="addRecipient()">
        <span class="ar-plus">+</span> Add Recipient
      </button>
    </section>

    <!-- More settings (native collapse — no extra TS) -->
    <details class="card more d-none" open>
      <summary class="more-summary">
        <span class="section-title">More Settings</span>
        <svg class="more-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </summary>
      <div class="more-body">
        <div class="opts-grid">
          <div class="opt">
            <label class="field-label">Days to Complete</label>
            <input type="number" min="1" class="input" formControlName="daysToComplete" placeholder="e.g. 7">
          </div>
          <div class="opt">
            <label class="field-label">Send a reminder every</label>
            <div class="reminder-row">
              <input type="number" min="1" class="input reminder-input" formControlName="reminderDays" placeholder="2">
              <span class="reminder-unit">days</span>
            </div>
          </div>
        </div>
        <div class="opt note-opt">
          <label class="field-label">Note for all recipients</label>
          <textarea class="input" rows="2" formControlName="note"
                    placeholder="Optional message shown in the notification"></textarea>
        </div>
      </div>
    </details>

  </form>
</div>
