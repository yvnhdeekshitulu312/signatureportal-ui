<div class="page-header justify-content-between">
    <h5 class="page-heading">Send for Signatures</h5>
    <div class="d-flex align-items-center">
        <button class="btn btn-main-fill mx-2" [disabled]="isUploading" (click)="gotoDocument()">Continue</button>
        <button class="btn btn-main-outline mx-2" routerLink="/dashboard">Cancel</button>
    </div>
</div>

<form [formGroup]="form" class="mt-3 p-3">
    <div class="drag_files_here border rounded-3 bg-white mx-auto">
        <div *ngIf="!pageImages.length">
            <!-- #fileInput moved OUTSIDE .drop-zone -- it used to be nested inside,
                 and since it also has a (click) handler, a programmatic click()
                 on the input bubbled back up and re-triggered fileInput.click()
                 a second time, causing two upload requests per file selection. -->
            <input #fileInput type="file" name="myFile" id="upload-doc" accept="application/pdf"
                   class="drop-zone__input" hidden (change)="uploadFile($event)">

            <div class="drop-zone d-flex align-items-center justify-content-center text-center mx-auto"
                 (click)="fileInput.click()"
                 (dragover)="$event.preventDefault()"
                 (drop)="onFileDropped($event)">
                <span class="d-flex flex-column align-items-center gap-2">
                    <!-- svg unchanged -->
                    <span class="drop-zone__prompt clr-grey fs-5">Drag files here</span>
                </span>
            </div>

            <div class="d-flex align-items-center justify-content-center uplaods">
                <div class="border rounded-2 p-2 text-center m-2 w-50" style="cursor: pointer;"
                     (click)="fileInput.click()">
                    <h6 class="m-0">Upload <br> <span>from computer</span></h6>
                </div>
            </div>
        </div>

        <div class="pdf-container top-margin" *ngIf="pageImages.length">
            <div class="row mx-0 g-2">
                <div class="col-3" *ngFor="let page of pageImages; let i = index">
                    <div class="border rounded-2 p-1 text-center">
                        <img [src]="page" class="w-100" [alt]="'Page ' + (i + 1)">
                        <small class="text-muted">Page {{ i + 1 }}</small>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center text-muted p-2" *ngIf="isUploading">Uploading...</div>
    </div>

    <div class="mt-3">
        <div class="row mx-0">
            <div class="col-lg-3 ps-0">
                <label class="form-label text-nowrap me-3">Document Name</label>
                <input type="text" class="form-control" formControlName="documentName">
            </div>
        </div>

        <div class="mt-3">
            <h6 class="clr-primary">Add Recipients</h6>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="d-flex align-items-center btn btn-main-outline">
                    <input type="checkbox" class="form-check-input m-0 me-2" formControlName="sendInOrder">
                    <label class="form-label m-0">Send in order</label>
                </button>
            </div>
        </div>

        <div class="mt-3" formArrayName="recipients">
            <div class="border rounded-2 bg-white mt-2"
                 *ngFor="let recipient of recipients.controls; let i = index"
                 [formGroupName]="i">
                <div class="drag_element p-3 d-flex align-items-center gap-2">
                    <div class="cursor-pointer">
                        <!-- drag-handle svg unchanged -->
                    </div>
                    <div class="row w-100 gx-2">
                        <div class="col-4">
                            <div class="d-flex align-items-center">
                                <input type="text" class="form-control me-2 order_count" disabled [value]="i + 1">
                                <input type="email" class="form-control" formControlName="email" placeholder="Email">
                            </div>
                        </div>
                        <div class="col-3">
                            <input type="text" class="form-control" formControlName="name" placeholder="Full name">
                        </div>
                        <div class="col-2">
                            <select class="form-select" formControlName="role">
                                <option value="Sign">Needs to sign</option>
                                <option value="Approve">Needs to approve</option>
                                <option value="View">Receives a copy</option>
                            </select>
                        </div>
                        <div class="col-2">
                            <select class="form-select" formControlName="deliveryMethod">
                                <option value="Email">Email</option>
                                <option value="Teams">Teams</option>
                            </select>
                        </div>
                        <div class="col-1 d-flex gap-1">
                            <button type="button" class="btn btn-main-outline">Customize</button>
                            <button type="button" class="btn btn-sm text-danger"
                                    *ngIf="recipients.length > 1"
                                    (click)="removeRecipient(i)">&times;</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3">
                <button type="button" class="btn btn-main-outline" (click)="addRecipient()">Add Recipient</button>
            </div>
        </div>

        <div class="mt-3 accordion" id="moreSettings">
            <div class="accordion-item border-0">
                <div class="d-flex align-items-center">
                    <h6 class="m-0 clr-primary px-3">More Settings</h6>
                    <button type="button" class="toggle-arrow" data-bs-toggle="collapse" data-bs-target="#eligibleCheck">
                        <img class="mx-2" src="assets/images/icons/icon-arrow-down.svg" alt="">
                    </button>
                </div>
                <div id="eligibleCheck" class="accordion-collapse collapse show">
                    <div class="accordion-body">
                        <div class="row g-3">
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label clr-primary">Days to Complete</label>
                                <input type="number" class="form-control" formControlName="daysToComplete">
                            </div>
                            <div class="col-md-6 col-lg-3">
                                <label class="form-label mb-0 clr-primary">Send a reminder every</label>
                                <div class="d-flex align-items-center">
                                    <input type="number" class="form-control me-2 remainder_input w-25" formControlName="reminderDays">
                                    <label class="form-label">days</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label clr-primary">Note for all recipients</label>
                                <textarea class="form-control" formControlName="note" rows="2" placeholder="Description"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
